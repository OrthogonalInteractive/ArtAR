name: Upload ARKit test build to TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    environment: ios-testflight
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple authentication setup
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Apple authentication secret: $name"
              exit 1
            fi
          done
        shell: bash
      - name: Write temporary Apple API key
        run: |
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'AuthKey.p8'
          path.write_text(os.environ['ASC_PRIVATE_KEY'])
          path.chmod(0o600)
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Archive parent app and App Clip with automatic signing
        working-directory: ios
        shell: bash
        run: |
          xcodebuild -project ArtAR.xcodeproj -scheme ArtAR \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ArtAR.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=85JY63L889 CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
      - name: Configure TestFlight upload
        working-directory: ios
        run: |
          python3 - <<'PY'
          import plistlib, pathlib
          pathlib.Path('build/ExportOptions.plist').write_bytes(plistlib.dumps({
            'method': 'app-store-connect', 'destination': 'upload',
            'teamID': '85JY63L889', 'signingStyle': 'automatic',
            'manageAppVersionAndBuildNumber': False,
          }))
          PY
      - name: Sign distribution build and upload to App Store Connect
        working-directory: ios
        run: |
          xcodebuild -exportArchive -archivePath build/ArtAR.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove temporary Apple API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
